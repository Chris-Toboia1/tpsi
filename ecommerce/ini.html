<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurazione</title>
</head>
<body>

<h1>Configurazione Store</h1>

<h3>Carica CSV</h3>
<input type="file" id="csvFile">

<h3>Carica CSS personalizzato</h3>
<input type="file" id="cssFile">

<script>

document.getElementById("csvFile").addEventListener("change", function(e) {

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(event) {

        localStorage.setItem("csvData", event.target.result);

        alert("CSV caricato correttamente");
    };

    reader.readAsText(file);
});


document.getElementById("cssFile").addEventListener("change", function(e) {

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(event) {

        localStorage.setItem("customCSS", event.target.result);

        alert("CSS caricato correttamente");
    };

    reader.readAsText(file);
});

</script>

</body>
</html>
