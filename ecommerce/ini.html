<!DOCTYPE html>
    <input type="file" id="csvFile" accept=".csv">

    <h3>Carica CSS personalizzato (opzionale)</h3>
    <input type="file" id="cssFile" accept=".css">

    <button id="continueBtn">
        Continua allo Store
    </button>

</div>

<script>

let csvLoaded = false;

// CARICAMENTO CSV

document.getElementById("csvFile").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        localStorage.setItem("csvData", event.target.result);

        csvLoaded = true;

        alert("CSV caricato correttamente");
    };

    reader.readAsText(file);
});

// CARICAMENTO CSS

document.getElementById("cssFile").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        localStorage.setItem("customCSS", event.target.result);

        alert("CSS caricato correttamente");
    };

    reader.readAsText(file);
});

// PULSANTE CONTINUA

document.getElementById("continueBtn").addEventListener("click", function() {

    if(!localStorage.getItem("csvData")) {
        alert("Carica prima un file CSV");
        return;
    }

    window.location.href = "index.html";
});

</script>

</body>
</html>
