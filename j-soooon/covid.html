<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dati COVID-19 Italia</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #dddddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Andamento Nazionale COVID-19 (Ultimi 10 giorni)</h2>
    <table id="tabella-covid"></table>

    <script>
        const urlJSON = 'https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json';

        const xhr = new XMLHttpRequest();

        xhr.open('GET', urlJSON, true);

        xhr.onload = function() {
            if (xhr.status === 200) {

                const dati = JSON.parse(xhr.responseText);
                const ultimi10 = dati.slice(-10);
                const tabella = document.getElementById('tabella-covid');
                const chiavi = Object.keys(ultimi10[0]);

                let html = '<thead><tr>';
                chiavi.forEach(chiave => {
                    html += `<th>${chiave}</th>`;
                });
                html += '</tr></thead><tbody>';

                ultimi10.forEach(giorno => {
                    html += '<tr>';
                    chiavi.forEach(chiave => {
                        html += `<td>${giorno[chiave]}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody>';

                tabella.innerHTML = html;
            } else {
                console.error("Errore nel caricamento dei dati:", xhr.status);
            }
        };

        xhr.onerror = function() {
            console.error("Si è verificato un errore di rete.");
        };

        xhr.send();
    </script>

</body>
</html>
