<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamperLife — Exclusive Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="header-inner container">
      <a href="#Home" class="logo">CAMPER<span>LIFE</span></a>
      
      <nav class="site-nav" id="main-nav">
        <ul class="nav-list">
          <li><a href="#Home" class="nav-link">Home</a></li>
          <li><a href="#Catalogo" class="nav-link">Catalogo</a></li>
          <li><a href="#Preferiti" class="nav-link">Preferiti</a></li>
          <li><a href="#Contatti" class="nav-link">Contatti</a></li>
        </ul>
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambia tema">🌙</button>
      </nav>

      <button class="hamburger-btn" id="hamburger-btn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section id="Home" class="hero">
      <div class="container">
        <h1 class="fade-in">L'Avventura è un <br><span>Privilegio.</span></h1>
        <p>Showroom esclusivo di camper di lusso e van per spedizioni.</p>
        <a href="#Catalogo" class="btn-gold">Esplora Collezione</a>
      </div>
    </section>

    <section id="Catalogo" class="container section">
      <div class="section-header">
        <h2>La Collezione</h2>
        <div class="filters">
          <input type="text" id="search-input" placeholder="Cerca modello...">
          <select id="category-filter">
            <option value="all">Tutti i modelli</option>
            <option value="van">Luxury Van</option>
            <option value="motorhome">Motorhome</option>
            <option value="mansardato">Mansardati</option>
          </select>
          <select id="sort-select">
            <option value="price-asc">Prezzo: Crescente</option>
            <option value="price-desc">Prezzo: Decrescente</option>
          </select>
        </div>
      </div>
      <div class="grid" id="catalog-grid"></div>
    </section>

    <section id="Preferiti" class="container section">
      <h2>I tuoi salvati</h2>
      <div class="grid" id="favorites-grid"></div>
    </section>

    <section id="Contatti" class="container section">
      <div class="contact-box">
        <h2>Richiedi Informazioni</h2>
        <form id="contact-form">
          <input type="text" id="input-name" placeholder="Nome" required>
          <input type="email" id="input-email" placeholder="Email" required>
          <textarea id="input-message" placeholder="Messaggio" rows="4" required></textarea>
          <button type="submit" class="btn-gold">Invia Richiesta</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="container">
    <p>&copy; 2024 CamperLife Luxury. Progetto Front-end.</p>
  </footer>

  <div id="modal-overlay" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
