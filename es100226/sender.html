<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sender</title>
</head>
<body>

    <div class="container">
        <h2>Pagina Sender</h2>

        <label>Parametro 1</label><br>
        <input type="text" id="param1"><br><br>

        <label>Parametro 2</label><br>
        <input type="text" id="param2"><br><br>

        <button onclick="salvaParametri()">Invia</button>
    </div>

    <script>
        function salvaParametri() {
            const p1 = document.getElementById("param1").value;
            const p2 = document.getElementById("param2").value;

            window.location.href =
                "receiver.html?param1=" (p1) +
                "&param2=" (p2);
        }
    </script>

</body>
</html>
