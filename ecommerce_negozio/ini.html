<!-- ini.html -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurazione Store</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.box{background:#fff;padding:20px;max-width:600px;margin:auto;border:1px solid #ccc}
input{width:100%;margin-bottom:20px}
button{padding:10px;cursor:pointer}
</style>

</head>

<body>

<div class="box">

<h1>Configurazione Store</h1>

<p>Carica file CSV</p>

<input type="file" id="csvFiles" accept=".csv" multiple>

<p>Carica CSS personalizzato (opzionale)</p>

<input type="file" id="cssFile" accept=".css">

<button onclick="generaStore()">Genera Store</button>

<p id="messaggio"></p>

</div>

<script>

async function generaStore(){

let csvInput=document.getElementById("csvFiles");
let cssInput=document.getElementById("cssFile");
let messaggio=document.getElementById("messaggio");

if(csvInput.files.length===0){

messaggio.innerText="Inserisci almeno un CSV";

return;
}

messaggio.innerText="Elaborazione...";

let prodotti=[];
let id=1;

for(let i=0;i<csvInput.files.length;i++){

let file=csvInput.files[i];

let testo=await file.text();

let risultato=Papa.parse(testo,{
header:true,
skipEmptyLines:true
});

for(let j=0;j<risultato.data.length;j++){

let riga=risultato.data[j];

riga._id=id;

id++;

prodotti.push(riga);
}
}

localStorage.setItem(
"storeDati",
JSON.stringify(prodotti)
);

if(cssInput.files.length>0){

let css=await cssInput.files[0].text();

localStorage.setItem("storeCss",css);

}else{

localStorage.removeItem("storeCss");
}

messaggio.innerText="Store creato";

setTimeout(function(){

window.location.href="store.html";

},1000);
}

</script>

</body>
</html>
