<!-- store.html -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Store</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style id="dynamic-style"></style>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#222;color:#fff;padding:15px}
header button{padding:10px;margin-right:10px;cursor:pointer}
.container{padding:20px}
.hidden{display:none}
.product{background:#fff;border:1px solid #ccc;padding:15px;margin-bottom:20px}
.product img{width:200px;height:200px;object-fit:contain}
.price{color:red;font-size:20px;font-weight:bold}
.cart-item{background:#fff;padding:10px;margin-bottom:10px;border:1px solid #ccc}
button{padding:10px;cursor:pointer}
</style>
</head>

<body>

<header>
<h1>Il Mio Store</h1>
<button onclick="mostraCatalogo()">Catalogo</button>
<button onclick="mostraCarrello()">Carrello (<span id="cartCount">0</span>)</button>
</header>

<div class="container">

<div id="catalogo">
<div id="listaProdotti"></div>
</div>

<div id="dettaglio" class="hidden">
<button onclick="mostraCatalogo()">Torna</button>
<div id="contenutoDettaglio"></div>
</div>

<div id="carrello" class="hidden">
<h2>Carrello</h2>
<div id="listaCarrello"></div>
<h3>Totale € <span id="totaleCarrello">0.00</span></h3>
<button onclick="stampaPDF()">Scarica PDF</button>
</div>

</div>

<script>

const datiStore=JSON.parse(localStorage.getItem("storeDati"))||[];
const cssPersonalizzato=localStorage.getItem("storeCss");

if(cssPersonalizzato){
document.getElementById("dynamic-style").innerHTML=cssPersonalizzato;
}

let carrello=[];

function mostraCatalogo(){
document.getElementById("catalogo").classList.remove("hidden");
document.getElementById("dettaglio").classList.add("hidden");
document.getElementById("carrello").classList.add("hidden");
}

function mostraDettaglio(){
document.getElementById("catalogo").classList.add("hidden");
document.getElementById("dettaglio").classList.remove("hidden");
document.getElementById("carrello").classList.add("hidden");
}

function mostraCarrello(){
document.getElementById("catalogo").classList.add("hidden");
document.getElementById("dettaglio").classList.add("hidden");
document.getElementById("carrello").classList.remove("hidden");
aggiornaCarrello();
}

function trovaCampo(objetto,testo){

let chiavi=Object.keys(oggetto);

for(let i=0;i<chiavi.length;i++){

if(chiavi[i].toLowerCase().includes(testo)){
return chiavi[i];
}
}

return "";
}

function renderizzaCatalogo(){

let contenitore=document.getElementById("listaProdotti");

contenitore.innerHTML="";

for(let i=0;i<datiStore.length;i++){

let item=datiStore[i];

let chiavi=Object.keys(item);

let keyImmagine=trovaCampo(item,"immagin")||"";
let keyPrezzo=trovaCampo(item,"prezz")||"";
let keyMarca=trovaCampo(item,"marca")||"";
let keyModello=trovaCampo(item,"modello")||chiavi[0];

let img=item[keyImmagine]||"https://via.placeholder.com/200";

let prezzo="0.00";

if(item[keyPrezzo]){
prezzo=parseFloat(item[keyPrezzo].replace(",",".")).toFixed(2);
}

let titolo="";

if(keyMarca){
titolo+=item[keyMarca]+" ";
}

titolo+=item[keyModello]||"Prodotto";

let div=document.createElement("div");

div.className="product";

div.innerHTML=`
<img src="${img}">
<h2>${titolo}</h2>
<div class="price">€ ${prezzo}</div>
<button onclick="vediDettaglio(${item._id})">Dettagli</button>
<button onclick="aggiungiAlCarrello(${item._id})">Aggiungi</button>
`;

contenitore.appendChild(div);
}
}

function vediDettaglio(id){

let item=null;

for(let i=0;i<datiStore.length;i++){

if(datiStore[i]._id==id){
item=datiStore[i];
}
}

let contenitore=document.getElementById("contenutoDettaglio");

contenitore.innerHTML="";

let keyImmagine=trovaCampo(item,"immagin")||"";

if(item[keyImmagine]){

contenitore.innerHTML+=`
<img src="${item[keyImmagine]}" width="300">
`;
}

contenitore.innerHTML+=`<h2>Dettagli</h2>`;

for(let chiave in item){

if(chiave!=="_id"&&chiave!==keyImmagine){

contenitore.innerHTML+=`
<p><strong>${chiave}</strong>: ${item[chiave]}</p>
`;
}
}

contenitore.innerHTML+=`
<button onclick="aggiungiAlCarrello(${id})">
Aggiungi
</button>
`;

mostraDettaglio();
}

function aggiungiAlCarrello(id){

for(let i=0;i<datiStore.length;i++){

if(datiStore[i]._id==id){
carrello.push(datiStore[i]);
}
}

document.getElementById("cartCount").innerText=carrello.length;
}

function aggiornaCarrello(){

let contenitore=document.getElementById("listaCarrello");

contenitore.innerHTML="";

let totale=0;

if(carrello.length===0){

contenitore.innerHTML="<p>Carrello vuoto</p>";

document.getElementById("totaleCarrello").innerText="0.00";

return;
}

for(let i=0;i<carrello.length;i++){

let item=carrello[i];

let chiavi=Object.keys(item);

let keyPrezzo=trovaCampo(item,"prezz")||"";
let keyModello=trovaCampo(item,"modello")||chiavi[0];

let prezzo=0;

if(item[keyPrezzo]){
prezzo=parseFloat(item[keyPrezzo].replace(",","."));
}

totale+=prezzo;

let div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`
<strong>${item[keyModello]}</strong>
<br>
€ ${prezzo.toFixed(2)}
<br><br>
<button onclick="rimuoviDalCarrello(${i})">Rimuovi</button>
`;

contenitore.appendChild(div);
}

document.getElementById("totaleCarrello").innerText=totale.toFixed(2);
}

function rimuoviDalCarrello(index){

carrello.splice(index,1);

document.getElementById("cartCount").innerText=carrello.length;

aggiornaCarrello();
}

function stampaPDF(){

if(carrello.length===0){
alert("Carrello vuoto");
return;
}

const {jsPDF}=window.jspdf;

const doc=new jsPDF();

doc.text("Ordine Store",20,20);

let y=40;
let totale=0;

for(let i=0;i<carrello.length;i++){

let item=carrello[i];

let chiavi=Object.keys(item);

let keyPrezzo=trovaCampo(item,"prezz")||"";
let keyModello=trovaCampo(item,"modello")||chiavi[0];

let nome=item[keyModello]||"Prodotto";

let prezzo=0;

if(item[keyPrezzo]){
prezzo=parseFloat(item[keyPrezzo].replace(",","."));
}

totale+=prezzo;

doc.text(
`${i+1}. ${nome} - EUR ${prezzo.toFixed(2)}`,
20,
y
);

y+=10;
}

y+=10;

doc.text(`Totale: EUR ${totale.toFixed(2)}`,20,y);

doc.save("ordine.pdf");
}

if(datiStore.length>0){

renderizzaCatalogo();

}else{

document.getElementById("listaProdotti").innerHTML=`
<p>Nessun prodotto trovato. Vai su ini.html</p>
`;
}

</script>

</body>
</html>
