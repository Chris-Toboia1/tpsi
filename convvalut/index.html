<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore Valute BCE</title>
    <link rel="stylesheet" href="stile.css">
</head>
<body>

    <header>
        <h1>Convertitore Valute BCE</h1>
        <p id="data">Tassi di cambio in caricamento...</p>
    </header>

    <main>
        <section>
            <h2>Calcola il Cambio</h2>

            <label for="quantita">Quantità:</label>
            <input type="number" id="quantita" value="100" oninput="calcola()">

            <label for="da-divisa">Da:</label>
            <select id="da-divisa" onchange="calcola()">
                <option value="0">EUR</option>
                <option value="1">USD</option>
                <option value="2">GBP</option>
                <option value="3">CHF</option>
                <option value="4">JPY</option>
            </select>

            <label for="a-divisa">Diventa:</label>
            <select id="a-divisa" onchange="calcola()">
                <option value="0">EUR</option>
                <option value="1" selected>USD</option>
                <option value="2">GBP</option>
                <option value="3">CHF</option>
                <option value="4">JPY</option>
            </select>

            <p id="risultato" class="risultato">100 EUR = 105.00 USD</p>
        </section>

        <section>
            <h2>Tassi di Cambio (Base 1 Euro)</h2>
            <table id="tabella-valute"></table>
        </section>
    </main>

    <script>
        let nomiValute = ["EUR", "USD", "GBP", "CHF", "JPY"];
        let tassiValute = [1.0, 1.05, 0.83, 0.93, 162.5];

        // Disegna subito la tabella e calcola appena la pagina è pronta
        creaTabella();
        calcola();

        // Scarica il file XML ufficiale della BCE tramite XMLHttpRequest
        const urlXML = 'https://api.codetabs.com/v1/proxy?quest=https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml';

        const xhr = new XMLHttpRequest();
        xhr.open('GET', urlXML, true);

        xhr.onload = function() {
            if (xhr.status === 200) {
                const parser = new DOMParser();
                const xml = parser.parseFromString(xhr.responseText, "text/xml");
                const listaCube = xml.getElementsByTagName("Cube");

                let nuoviNomi = ["EUR"];
                let nuoviTassi = [1.0];

                for (let i = 0; i < listaCube.length; i++) {
                    let dataTrovata = listaCube[i].getAttribute("time");
                    if (dataTrovata != null) {
                        document.getElementById("data").innerText = "Tassi ufficiali BCE del: " + dataTrovata;
                    }

                    let valuta = listaCube[i].getAttribute("currency");
                    let tasso = listaCube[i].getAttribute("rate");

                    if (valuta != null && tasso != null) {
                        nuoviNomi.push(valuta);
                        nuoviTassi.push(Number(tasso));
                    }
                }

                // Se ha scaricato correttamente tutte le valute dall'XML, aggiorna le tendine
                if (nuoviNomi.length > 1) {
                    nomiValute = nuoviNomi;
                    tassiValute = nuoviTassi;
                    aggiornaMenu();
                    creaTabella();
                    calcola();
                }
            } else {
                document.getElementById("data").innerText = "Tassi base caricati.";
            }
        };

        xhr.onerror = function() {
            document.getElementById("data").innerText = "Tassi base caricati.";
        };

        xhr.send();

        function aggiornaMenu() {
            let menuDa = document.getElementById("da-divisa");
            let menuA = document.getElementById("a-divisa");

            // Salva le valute che l'utente aveva già scelto prima dell'aggiornamento
            let sceltaPrecedenteDa = menuDa.value;
            let sceltaPrecedenteA = menuA.value;

            menuDa.innerHTML = "";
            menuA.innerHTML = "";

            for (let i = 0; i < nomiValute.length; i++) {
                let opt1 = document.createElement("option");
                opt1.value = i;
                opt1.text = nomiValute[i];
                menuDa.add(opt1);

                let opt2 = document.createElement("option");
                opt2.value = i;
                opt2.text = nomiValute[i];
                menuA.add(opt2);
            }

            menuDa.value = sceltaPrecedenteDa;
            menuA.value = sceltaPrecedenteA;
        }

        function calcola() {
            let qta = Number(document.getElementById("quantita").value);
            let indiceDa = document.getElementById("da-divisa").value;
            let indiceA = document.getElementById("a-divisa").value;

            if (qta <= 0 || document.getElementById("quantita").value === "") {
                document.getElementById("risultato").innerText = "Inserisci una quantità maggiore di 0.";
                return;
            }

            let tassoDa = tassiValute[indiceDa];
            let tassoA = tassiValute[indiceA];

            let inEuro = qta / tassoDa;
            let totale = inEuro * tassoA;

            document.getElementById("risultato").innerText = 
                qta + " " + nomiValute[indiceDa] + " = " + totale.toFixed(2) + " " + nomiValute[indiceA];
        }

        function creaTabella() {
            let tabella = document.getElementById("tabella-valute");
            let html = "<thead><tr><th>Divisa</th><th>Valore per 1 Euro</th></tr></thead><tbody>";

            for (let i = 0; i < nomiValute.length; i++) {
                html += "<tr>";
                html += "<td>" + nomiValute[i] + "</td>";
                html += "<td>" + tassiValute[i] + "</td>";
                html += "</tr>";
            }

            html += "</tbody>";
            tabella.innerHTML = html;
        }
    </script>

</body>
</html>
